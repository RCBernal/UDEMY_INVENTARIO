spring.application.name=Inventario
#Conexion a mysql

spring.datasource.url=jdbc:mysql://localhost:3306/inventario_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1998
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Actualiza el schema de la BD
spring.jpa.hibernate.ddl-auto=update
#Muestra los comandos SQL que esta realizndo la base desde jpa
spring.jpa.show-sql=true
#Solamente estetica para que se vea mejor en formato sql
spring.jpa.properties.hibernate.format_sql=true